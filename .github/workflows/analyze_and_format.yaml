name: Analyze & Format

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - name: "Install Flutter"
        run: ./.github/workflows/scripts/install-flutter.sh stable
      - name: "Pub Get"
        run: flutter pub get
      - name: "Dart Analyze"
        run: dart analyze . --fatal-infos
